<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My Magic World Lab</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
   
  <style>
   body { background: rgb(236, 236, 232); }

h1, h3 { color: darkorange; }

.box { background: white; color: darkorange; }
  </style>
</head>

<body>
 <div class="container py-4">
   <h1 class="mb-1">My Magic World Lab</h1>
   <p class="text-muted mb-4"></p>

   <div class="card mb-4">
      <div class="card-body">
         <h3 class="card-title">What Type IS It</h3>

         <button class="btn btn-warning" onclick="checktypes()">reveal the type</button>
         <div id="typeResult" class="box p-3 mt-3 rounded">press the button to reveal the type</div>
      </div>
   </div>

   <div class="card mb-4">
      <div class="card-body">
         <h3 class="card-title">switch the type</h3>
         <input id="numIn" class="form-control mb-2 ">
         <button class="btn btn-warning" onclick="tonum()">turn in to number</button>
         <button class="btn btn-warning" onclick="tostr()">turn in to text</button>
         <div id="convResult" class="box p-3 mt-3 rounded">type a number and press the button</div>
         </div>
         </div>
         
      <div class="card mb-4">
         <div class="card-body">
            <h3 class="card-title">find and swap a word</h3>
            <input id="findword" class="form-control mb-2 ">
            <input id="swapword" class="form-control mb-2 ">
            <button class="btn btn-warning" onclick="dosearch()">find it</button>
            <button class="btn btn-warning" onclick="doreaplace()">swap it</button>
            <div id="srResult" class="box p-3 mt-3 rounded">sentence:the dragon flew over the big castle</div>
            </div>
            </div>
            
   <div class="card mb-4">
      <div class="card-body">
   
         <h3 class="card-title">Catch the Mistake</h3>
   
         <input id="divIn" class="form-control mb-2"
            placeholder="Divide 100 by this — try a number or type something silly!">
   
         <button class="btn btn-warning" onclick="trySafe()">Try It!</button>
   
         <div id="errResult" class="box p-3 mt-3 rounded">Type a number or something silly and see what happens!</div>
   
      </div>
   </div>

 </div> 

 <script>
   var sen ="the dragon flew over the big castle";

   function checktypes(){
      document.getElementById("typeResult").innerText = "Score 42 — type: " + typeof 42 + "\n" +

         "Name 'Zimmal' — type: " + typeof "Zimmal" + "\n" +

         "Game over true — type: " + typeof true;
   }


   function tostr(){
      var v =document.getElementById("numIn").value;
      document.getElementById("convResult").innerHTML = "String(" + v + ") = '" + String(v) + "' — now it is a: " + typeof String(v);

         }

         function tonum() {

            var v = document.getElementById("numIn").value;

            document.getElementById("convResult").innerHTML = "Number('" + v + "') = " + Number(v) + " — now it is a: " + typeof Number(v);

         }
   

         function dosearch(){
           var w =document.getElementById("findword").value;
           var p =sen.search(w);
           document.getElementById("srResult").innerHTML = p === -1 ? "'" + w + "' is not in the sentence — try another word!" : "Found '" + w + "' hiding at position " + p + "!";

            }

            function doreaplace() {

               var w = document.getElementById("findword").value;

               document.getElementById("srResult").innerHTML = "New sentence: " + sen.replace(w, document.getElementById("swapword").value);

            } 


            function trySafe() {

                  try {

                     var n = document.getElementById("divIn").value;

                     if (n === "" || isNaN(n)) { throw "That is not a number — you caught the error!"; }

                     document.getElementById("errResult").innerHTML = "100 / " + n + " = " + (100 / Number(n)) + " — well done!";

                  } catch (err) { document.getElementById("errResult").innerHTML = "Error caught: " + err; }

               }
         
 </script>
</body>
</html>
